<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FGCK Nyeri</title>
    <link rel="stylesheet" href="../styles/admin.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h2>Gallery Management</h2>
            <button id="logoutBtn" onclick="handleLogout()">Logout</button>
        </header>
        
        <div class="upload-section">
            <h3>Upload New Images</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="imageFile">Select Image:</label>
                    <input type="file" id="imageFile" name="images[]" accept="image/*" multiple required>
                    <div id="imagePreview" class="preview-container"></div>
                </div>
                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="worship">Worship</option>
                        <option value="events">Events</option>
                        <option value="youth">Youth</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="caption">Caption:</label>
                    <input type="text" id="caption" name="caption" required>
                </div>
                <button type="submit">Upload Images</button>
            </form>
        </div>

        <div class="gallery-container">
            <h3>Uploaded Images</h3>
            <div id="imageGrid" class="admin-gallery-grid"></div>
        </div>
    </div>

    <script>
        // Check authentication
        if (!localStorage.getItem('adminLoggedIn')) {
            window.location.href = 'login.html';
        }

        function handleLogout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }

        // Handle image preview
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'preview-image';
                    preview.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        });

        // Handle form submission
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const files = document.getElementById('imageFile').files;
            const category = document.getElementById('category').value;
            const caption = document.getElementById('caption').value;

            // Store images in localStorage (temporary solution)
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const images = JSON.parse(localStorage.getItem('galleryImages') || '[]');
                    images.push({
                        id: Date.now(),
                        src: e.target.result,
                        category,
                        caption
                    });
                    localStorage.setItem('galleryImages', JSON.stringify(images));
                    loadImages();
                };
                reader.readAsDataURL(file);
            });

            this.reset();
            document.getElementById('imagePreview').innerHTML = '';
            alert('Images uploaded successfully!');
        });

        // Load existing images
        function loadImages() {
            const imageGrid = document.getElementById('imageGrid');
            const images = JSON.parse(localStorage.getItem('galleryImages') || '[]');
            
            imageGrid.innerHTML = images.map(img => `
                <div class="image-card">
                    <img src="${img.src}" alt="${img.caption}">
                    <div class="image-info">
                        <p>${img.caption}</p>
                        <p class="category">${img.category}</p>
                        <button onclick="deleteImage(${img.id})" class="delete-btn">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Delete image
        function deleteImage(id) {
            if (confirm('Are you sure you want to delete this image?')) {
                let images = JSON.parse(localStorage.getItem('galleryImages') || '[]');
                images = images.filter(img => img.id !== id);
                localStorage.setItem('galleryImages', JSON.stringify(images));
                loadImages();
            }
        }

        // Load images on page load
        loadImages();
    </script>
</body>
</html>
